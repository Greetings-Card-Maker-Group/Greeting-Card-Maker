<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greetings Card Maker</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="page-container">
        <header class="hero">
            <h1>Greetings Card Maker</h1>
            <p>Create a special card in minutes or open the ones you already saved.</p>
        </header>

        <main class="options-container">
            <a href="#" class="option-box">
                <h2>Check Saved Cards</h2>
                <p>Open your saved greeting cards and continue editing or viewing them.</p>
            </a>

            <a href="#" class="option-box">
                <h2>Browse Templates</h2>
                <p>Choose a template and start making a new personalised greeting card.</p>
            </a>
        </main>
    </div>
</body>
</html>
